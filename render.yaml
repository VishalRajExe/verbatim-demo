# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint — Legal Contract Intelligence BACKEND (FastAPI + MySQL).
#
# Deploy this backend to Render, the Next.js frontend to Vercel (see
# DEPLOYMENT.md). Render does NOT offer managed MySQL, so point DATABASE_URL at
# an external MySQL (PlanetScale / Aiven / Railway / TiDB / ClearDB). Plain
# "mysql://" URLs are auto-normalised to "mysql+pymysql://" by the app.
#
# Secrets are intentionally NOT stored in this file: keys marked `sync: false`
# are read from the Render dashboard on (re)deploy, so nothing sensitive lands
# in git. Create the service with:  render blueprints sync   (or via the UI).
#
# ── Service name ─────────────────────────────────────────────────────────────
# The name below MUST match the live Render service name exactly so that
# 'render blueprints sync' updates the correct running service rather than
# creating a duplicate. Current live service: verbatim-demo
# (https://verbatim-demo.onrender.com).
#
# ── Why Docker instead of Render's native Python buildpack ────────────────────
# Render's default Python is now 3.14, and our pinned packages (rapidfuzz,
# PyMuPDF, cryptography, lxml) have NO cp314 wheels. On 3.14 pip falls back to
# compiling rapidfuzz from source, which fails in its build backend:
#   ConfigurationError: Extra keys present in "project": 'Changelog', ...
#   error: metadata-generation-failed  ╰─> rapidfuzz
# The `PYTHON_VERSION` env pin is not reliably honoured by the native buildpack,
# so we build the repo's backend/Dockerfile instead. Its base image
# (python:3.12-slim) pins the interpreter, so every dependency installs from a
# prebuilt wheel and the build is deterministic.
#
# ── Plan note ────────────────────────────────────────────────────────────────
# The live service runs on the free plan. Free-tier instances spin down after
# 15 minutes of inactivity; the UptimeRobot keep-alive monitor at /health
# (every 5 min) prevents sleep. Persistent disks require a paid plan and are
# therefore not attached here; uploaded files are ephemeral on free tier
# (DB rows survive, file bytes do not — see DEPLOYMENT.md §6).
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: verbatim-demo      # MUST match the live Render service name exactly
    runtime: docker
    plan: free               # Matches live service plan (free tier)
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health  # GET /health → 200 {"status":"ok"} (no DB, lightweight)
    autoDeployTrigger: commit

    envVars:
      # ── Secrets (set in the Render dashboard, never committed) ──
      - key: DATABASE_URL
        sync: false          # e.g. mysql://user:pass@host:3306/legal_contract_intelligence?ssl_mode=REQUIRED
      - key: GEMINI_API_KEY
        sync: false
      # ── Behaviour ──
      - key: GEMINI_MODEL
        value: "gemini-flash-lite-latest"
      - key: LLM_PROVIDER
        value: "gemini"      # "mock" runs a fully offline deterministic demo
      - key: CORS_ORIGINS
        # JSON list of allowed browser origins. Replace with your Vercel URL.
        value: '["http://localhost:3000","https://your-app.vercel.app"]'
      - key: STORAGE_DIR
        value: "/app/data"   # ephemeral on free tier; mount a disk on a paid plan
      - key: MAX_FILE_SIZE_MB
        value: "80"

    # ── Persistent disk (paid plans only) ────────────────────────────────────
    # Uncomment the block below when upgrading to a paid Render plan. On free
    # tier the filesystem is ephemeral; uploaded files are lost on restart but
    # DB rows survive. To re-enable, also update STORAGE_DIR to /var/data/lci.
    #
    # disks:
    #   - name: lci-storage
    #     mountPath: /var/data
    #     sizeGB: 1

  # ── Native-Python alternative (only if you cannot switch this service to
  #    Docker). Render's buildpack still needs a 3.12/3.13 interpreter for the
  #    pinned wheels to exist; set PYTHON_VERSION in the dashboard too.
  #
  # - type: web
  #   name: lci-backend
  #   runtime: python
  #   plan: starter
  #   region: oregon
  #   rootDir: backend
  #   buildCommand: "pip install -r requirements.txt"
  #   startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
  #   healthCheckPath: /health
  #   envVars:
  #     - key: PYTHON_VERSION
  #       value: "3.12.8"
